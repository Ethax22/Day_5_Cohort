<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Developer Collaboration Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-left">
                <h1 class="logo">DevCollab</h1>
            </div>
            <div class="navbar-right">
                <button class="btn-upgrade">Upgrade to Premium</button>
                <div class="user-profile">
                    <img id="userAvatar" src="public/default-avatar.svg" alt="User avatar" class="avatar">
                    <span id="userName" class="user-name">User</span>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    
    <main class="dashboard-container">
        
        <section class="dashboard-header">
            <div class="header-content">
                <h2>My Projects</h2>
                <p>Manage and collaborate on your projects</p>
            </div>
            <button id="createProjectBtn" class="btn-create-project">+ New Project</button>
        </section>

        
        <section class="projects-section">
            <h3 class="section-title">Owned Projects</h3>
            <div class="projects-grid" id="ownedProjects">
                
                <div class="project-card-empty">
                    <p>No owned projects yet. Create one to get started!</p>
                </div>
            </div>
        </section>

        
        <section class="projects-section">
            <h3 class="section-title">Collaborated Projects</h3>
            <div class="projects-grid" id="collaboratedProjects">
                
                <div class="project-card-empty">
                    <p>You haven't been invited to any projects yet.</p>
                </div>
            </div>
        </section>
    </main>

    
    <div id="createProjectModal" class="modal hidden">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Project</h3>
                <button id="closeModalBtn" class="btn-close">&times;</button>
            </div>
            <form id="createProjectForm" class="modal-form">
                <div class="form-group">
                    <label for="projectName">Project Name *</label>
                    <input type="text" id="projectName" name="projectName" placeholder="Enter project name" required>
                </div>
                <div class="form-group">
                    <label for="projectDescription">Description</label>
                    <textarea id="projectDescription" name="projectDescription" placeholder="Enter project description" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    
    <template id="projectCardTemplate">
        <div class="project-card">
            <div class="project-card-header">
                <h4 class="project-name"></h4>
                <div class="project-menu">
                    <button class="btn-menu">⋮</button>
                    <div class="dropdown-menu hidden">
                        <a href="#" class="menu-item open-project">Open</a>
                        <a href="#" class="menu-item edit-project">Edit</a>
                        <a href="#" class="menu-item delete-project">Delete</a>
                    </div>
                </div>
            </div>
            <p class="project-description"></p>
            <div class="project-stats">
                <div class="stat">
                    <span class="stat-label">Open Tasks</span>
                    <span class="stat-value" data-type="openTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Collaborators</span>
                    <span class="stat-value" data-type="collaborators">0</span>
                </div>
            </div>
            <div class="project-footer">
                <div class="collaborators-avatars">
                    
                </div>
                <span class="project-date" data-date=""></span>
            </div>
        </div>
    </template>

    
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
